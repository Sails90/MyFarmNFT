<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mi Granja NFT - HD Pixel Art</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Fredoka', cursive, sans-serif; user-select: none; }
        body { background: #000; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        
        #game-container {
            width: 100vw;
            height: 100vh;
            max-width: 420px;
            position: relative;
        }

        /* HEADER */
        .top-ui {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; z-index: 10;
            pointer-events: none;
        }
        .badge {
            background: rgba(20, 10, 5, 0.85); border: 2px solid #f5b041;
            padding: 6px 12px; border-radius: 12px; color: #fff; font-size: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }

        /* BARRA INFERIOR */
        .bottom-ui {
            position: absolute; bottom: 15px; left: 10px; right: 10px;
            display: flex; justify-content: space-around; z-index: 10;
        }
        .btn-ui {
            background: linear-gradient(180deg, #f39c12, #d35400);
            border: 2px solid #f1c40f; border-radius: 12px; color: #fff;
            padding: 10px 16px; font-weight: bold; font-size: 13px;
            box-shadow: 0 4px 0 #873600; cursor: pointer;
        }
        .btn-ui:active { transform: translateY(3px); box-shadow: 0 1px 0 #873600; }
    </style>
</head>
<body>

    <div id="game-container">
        <div class="top-ui">
            <div class="badge">💰 <span id="bal">0.00 USDT</span></div>
            <div class="badge" style="border-color:#2ecc71;">🎓 Becas: <span id="edu">$0.00</span></div>
        </div>

        <div class="bottom-ui">
            <button class="btn-ui" onclick="openShop()">🌾 Granjas</button>
            <button class="btn-ui" onclick="openWheel()">🎡 Ruleta</button>
            <button class="btn-ui" onclick="openPvp()">⚔️ PvP</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if(tg) tg.expand();

        // MOTOR DE JUEGO PHASER 3 (GRÁFICOS PIXEL ART HD)
        const config = {
            type: Phaser.AUTO,
            width: 420,
            height: 700,
            parent: 'game-container',
            pixelArt: true,
            scene: { preload: preload, create: create, update: update }
        };

        const game = new Phaser.Game(config);

        function preload() {
            // Carga de Spritesheets Pixel Art de alta calidad
            this.load.image('tiles', 'https://labs.phaser.io/assets/tilemaps/tiles/catastrophi_tiles.png');
            this.load.image('chicken', 'https://labs.phaser.io/assets/sprites/chick.png');
            this.load.image('barn', 'https://labs.phaser.io/assets/sprites/house.png');
            this.load.image('crop', 'https://labs.phaser.io/assets/sprites/apple.png');
        }

        function create() {
            // Fondo Agua
            this.cameras.main.setBackgroundColor('#2980b9');

            // Dibujar Isla Verde
            let graphics = this.add.graphics();
            graphics.fillStyle(0x27ae60, 1);
            graphics.fillRoundedRect(30, 100, 360, 480, 30);
            graphics.lineStyle(6, 0x1e8449, 1);
            graphics.strokeRoundedRect(30, 100, 360, 480, 30);

            // Zonas de Granja
            this.add.text(60, 120, '🌾 SIEMBRA', { font: 'bold 14px Fredoka', fill: '#f1c40f' });
            this.add.text(240, 120, '🐔 GALLINERO', { font: 'bold 14px Fredoka', fill: '#f1c40f' });

            // Parcelas con Cosecha
            for(let i=0; i<4; i++) {
                let x = 60 + (i % 2) * 65;
                let y = 160 + Math.floor(i / 2) * 65;
                let tile = this.add.rectangle(x, y, 50, 50, 0x5d4037).setInteractive();
                let plant = this.add.image(x, y, 'crop').setScale(1.2);
                
                tile.on('pointerdown', () => {
                    if(tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
                    this.tweens.add({ targets: plant, scale: 1.6, duration: 100, yoyo: true });
                });
            }

            // Gallinas Animadas
            let chicken1 = this.add.image(270, 180, 'chicken').setScale(1.5).setInteractive();
            let chicken2 = this.add.image(330, 180, 'chicken').setScale(1.5).setInteractive();

            this.tweens.add({
                targets: [chicken1, chicken2],
                y: '+=5',
                duration: 500,
                yoyo: true,
                repeat: -1
            });

            // Granero / Casa Principal
            this.add.image(210, 420, 'barn').setScale(2);
        }

        function update() {}

        function openShop() { alert("🛒 Tienda de Granjas NFT"); }
        function openWheel() { alert("🎡 Ruleta"); }
        function openPvp() { alert("⚔️ Modo PvP"); }
    </script>
</body>
</html>
